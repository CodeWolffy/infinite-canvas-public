map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# 前端产物是内容哈希文件，开启压缩；SSE（text/event-stream）不在压缩类型里，不受影响。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json text/plain;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 全局安全响应标头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP 先以 Report-Only 模式运行，避免破坏动态图片加载与外部资源
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    location / {
        try_files $uri /index.html;
    }

    # Vite 产物文件名带内容哈希，可以长期强缓存；缺失文件直接 404，不回落成 HTML。
    # Nginx 在当前 location 存在 add_header 时不继承父级，故在此补齐核心安全头。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 入口文件引用哈希产物，必须每次校验，避免发版后拿到旧入口。
    # 补齐安全标头以保证 HTML 顶层上下文的安全策略生效。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 与 Go 后端 MAX_UPLOAD_BYTES（默认 52428800 字节，即 50MB）严格对齐。
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_buffering off;
        # SSE 使用心跳维持连接，沿用现有代理超时。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:3001/health;
        proxy_set_header Host $host;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
