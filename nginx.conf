map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# 前端产物是内容哈希文件，开启压缩；SSE（text/event-stream）不在压缩类型里，不受影响。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json text/plain;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Vite 产物文件名带内容哈希，可以长期强缓存；缺失文件直接 404，不回落成 HTML。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口文件引用哈希产物，必须每次校验，避免发版后拿到旧入口。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_buffering off;
        # SSE 使用心跳维持连接，沿用现有代理超时。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:3001/health;
        proxy_set_header Host $host;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
