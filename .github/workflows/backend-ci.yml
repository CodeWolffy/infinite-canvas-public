name: Backend CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: canvas_ci_test
          POSTGRES_USER: canvas_ci_test
          POSTGRES_PASSWORD: canvas_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvas_ci_test -d canvas_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://canvas_ci_test:canvas_ci_test@localhost:5432/canvas_ci_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -v ./...

      - name: Build server binary
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        run: govulncheck ./...
